<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuperar senha — SAAR</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="login.css">
  <link rel="stylesheet" href="Recuperarsenha.css">
  <script src="config.js"></script>
  <script src="api.js"></script>
</head>
<body>

  <!-- ===== Faixa superior com os logos (igual ao login) ===== -->
  <header class="topbar">
    <div class="topbar-left">
      <img src="SAAR.png" alt="SAAR" class="logo-saar">
    </div>
    <div class="topbar-right">
      <img src="NTE.png" alt="NTE" class="logo-org">
      <img src="semed.png" alt="SEMED" class="logo-org">
      <button class="modo-toggle" id="modoToggle" type="button" aria-pressed="false" aria-label="Alternar tema claro/escuro" title="Tema claro/escuro">
        <svg class="modo-icon modo-icon-sol" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
        <svg class="modo-icon modo-icon-lua" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
    </div>
  </header>

  <main class="login-shell">
    <div class="recover-card">

      <a href="Login.html" class="back-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 18l-6-6 6-6"/>
        </svg>
        Voltar ao login
      </a>

      <!-- indicador de etapas -->
      <div class="steps">
        <div class="dot active" id="dot1">1</div>
        <div class="bar" id="bar"></div>
        <div class="dot" id="dot2">2</div>
      </div>

      <!-- ===== ETAPA 1: usuário + CPF ===== -->
      <section class="step active" id="step1">
        <div class="recover-head">
          <div class="recover-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
          </div>
          <h2>Recuperar senha</h2>
          <p>Informe seu usuário e CPF para continuar.</p>
        </div>

        <div class="error-msg" id="err1"></div>

        <form id="form1" autocomplete="off" onsubmit="return false;">
          <div class="field">
            <label for="user">Usuário</label>
            <input type="text" id="user" name="user" placeholder="Digite seu usuário" required>
          </div>

          <div class="field">
            <label for="cpf">CPF</label>
            <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" inputmode="numeric" maxlength="14" required>
          </div>

          <button type="submit" class="btn-primary">Continuar</button>
        </form>
      </section>

      <!-- ===== ETAPA 2: nova senha ===== -->
      <section class="step" id="step2">
        <div class="recover-head">
          <div class="recover-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              <circle cx="12" cy="16.5" r="1.4" fill="currentColor" stroke="none"/>
            </svg>
          </div>
          <h2>Nova senha</h2>
          <p>Crie uma nova senha para a sua conta.</p>
        </div>

        <div class="error-msg" id="err2"></div>

        <form id="form2" autocomplete="off" onsubmit="return false;">
          <div class="field">
            <label for="nova">Nova senha</label>
            <div class="input-wrap">
              <input type="password" id="nova" class="has-toggle" placeholder="Digite a nova senha" autocomplete="new-password" required>
              <button type="button" class="toggle-pw" data-target="nova" aria-label="Mostrar senha" aria-pressed="false">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </div>
          </div>
          <p class="hint">Use pelo menos 6 caracteres.</p>

          <div class="field">
            <label for="nova2">Digite a senha novamente</label>
            <div class="input-wrap">
              <input type="password" id="nova2" class="has-toggle" placeholder="Confirme a nova senha" autocomplete="new-password" required>
              <button type="button" class="toggle-pw" data-target="nova2" aria-label="Mostrar senha" aria-pressed="false">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </div>
          </div>

          <button type="submit" class="btn-primary">Salvar nova senha</button>
        </form>
      </section>

      <!-- ===== SUCESSO ===== -->
      <section class="step success-box" id="stepOk">
        <div class="recover-head">
          <div class="recover-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 6L9 17l-5-5"/>
            </svg>
          </div>
          <h2>Senha alterada!</h2>
          <p>Sua senha foi redefinida com sucesso. Você já pode acessar o sistema.</p>
        </div>
        <a href="Login.html" class="btn-primary">Ir para o login</a>
      </section>

    </div>
  </main>

  <script>
    /* ===== Modo claro/escuro (compartilhado com o console) ===== */
    try {
      document.documentElement.setAttribute('data-modo', modoSalvo());
      const modoToggle = document.getElementById('modoToggle');
      if (modoToggle) {
        modoToggle.setAttribute('aria-pressed', String(modoSalvo() === 'escuro'));
        modoToggle.addEventListener('click', () => {
          alternarModo();
          modoToggle.setAttribute('aria-pressed', String(modoSalvo() === 'escuro'));
        });
      }
    } catch (e) {}

    /* ===== Máscara de CPF (000.000.000-00) ===== */
    const cpf = document.getElementById('cpf');
    cpf.addEventListener('input', () => {
      let v = cpf.value.replace(/\D/g, '').slice(0, 11);
      v = v.replace(/(\d{3})(\d)/, '$1.$2');
      v = v.replace(/(\d{3})(\d)/, '$1.$2');
      v = v.replace(/(\d{3})(\d{1,2})$/, '$1-$2');
      cpf.value = v;
    });

    /* ===== Mostrar / esconder senha (funciona nos dois campos) ===== */
    const eyeOpen   = '<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/>';
    const eyeClosed = '<path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c6.5 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.5 13.5 0 0 0 2 12s3.5 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="2" y1="2" x2="22" y2="22"/>';

    document.querySelectorAll('.toggle-pw').forEach(btn => {
      btn.addEventListener('click', () => {
        const input = document.getElementById(btn.dataset.target);
        const svg = btn.querySelector('svg');
        const showing = input.type === 'text';
        input.type = showing ? 'password' : 'text';
        svg.innerHTML = showing ? eyeOpen : eyeClosed;
        btn.setAttribute('aria-pressed', String(!showing));
        btn.setAttribute('aria-label', showing ? 'Mostrar senha' : 'Esconder senha');
      });
    });

    /* ===== Controle das etapas ===== */
    const err1 = document.getElementById('err1');
    const err2 = document.getElementById('err2');
    const showError = (el, msg) => { el.textContent = msg; el.classList.add('show'); };
    const hideError = (el) => el.classList.remove('show');
    const showStep  = (id) => {
      document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
      document.getElementById(id).classList.add('active');
    };

    /* Etapa 1 -> Etapa 2 */
    document.getElementById('form1').addEventListener('submit', () => {
      hideError(err1);
      const user = document.getElementById('user').value.trim();
      const cpfDigits = cpf.value.replace(/\D/g, '');

      if (!user)                  { showError(err1, 'Digite seu usuário.'); return; }
      if (cpfDigits.length !== 11){ showError(err1, 'Digite um CPF válido (11 dígitos).'); return; }

      /* ============================================================
         AQUI vai a verificação no servidor (backend):
         envie "user" e "cpfDigits", e só avance se o CPF EXISTIR.
         Como esta página é só front-end, vamos avançar direto.
         ============================================================ */
      showStep('step2');
      document.getElementById('dot2').classList.add('active');
      document.getElementById('bar').classList.add('active');
    });

    /* Etapa 2 -> Sucesso */
    document.getElementById('form2').addEventListener('submit', () => {
      hideError(err2);
      const s1 = document.getElementById('nova').value;
      const s2 = document.getElementById('nova2').value;

      if (s1.length < 6) { showError(err2, 'A senha deve ter pelo menos 6 caracteres.'); return; }
      if (s1 !== s2)     { showError(err2, 'As senhas não coincidem.'); return; }

      /* AQUI vai o salvamento da nova senha no servidor (backend). */
      showStep('stepOk');
    });
  </script>
</body>
</html>
